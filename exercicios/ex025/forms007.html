<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="">
        <p>
            <label for="iest">Estado</label>
            <select name="estado" id="iest">
                <optgroup label="região sudeste">
                    <option value="MG">minas gerais</option>
                    <option value="sc" selected>santa catarina</option>
                    <option value="rs">rio grande do sul</option>
                </optgroup>
                <optgroup label="região central">
                    <option value="sp">sao paulo</option>
                    <option value="rj">rio de janeiro </option>
                    <option value="pe">pernanbuco</option>
                </optgroup>
            </select>
        </p>
        <p>
            <label for="iprof">profissão</label>
            <input type="text" name="prof" id="iprof" list="lstprof">
            <datalist id="lstprof">
                <option value="adm">administrador</option>
                <option value="cont">contador</option>
                <option value="dev">desenvolverdor</option>
                <option value="prof">professo</option>
            </datalist>
        </p>

        <p>
            <label for="imsg">mensagem</label><br>
           <textarea name="msg" id="imsg" cols="30" rows="10"></textarea>
        </p>

        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        
        </p>
    </form>
</body>
</html>
