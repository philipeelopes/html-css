<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados pessoais</legend>
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nomme" id="inome" minlength="5" maxlength="20" required>
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="imeail" required autocomplete="on">
            </p>
            <P>    <label for="itel">telefone</label>
            <input type="tel" name="tel" id="itel" autocomplete="tel"  pattern=
            "^\(d{2}\)\d{4,5}-\d{4}$">
                 </P>
        </fieldset>
      
        <!--estudar depos sobre RegEX-->
        
        <p>
            <input type="submit" value="enviar">
            <input type="reset" value="limpar">
        </p>


    </form>

</body>
</html>
