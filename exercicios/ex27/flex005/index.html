<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizado flex</title>
    <style>
        *{
            padding: 0px;
            margin: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(40, 143, 0);
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            padding-top: 45px;
        }
        main{
            background-color: rgb(217, 255, 0);
            height: 90vh;
            width: 95vw;
            border-radius: 50%;

            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }
        section{
            background-color: rgb(50, 50, 151);
            width: 200px;
            height: 200px;
            border-radius: 50%;
        }
        h1{
        text-align: center;
        padding-top: 30%;
        font-size: 2.3em;
        
        }
        p{
            background-color: white;
            border-radius: 0px 0px 15px 15px;
            font-size: 0.8em;
            height: 30px;
            text-align: center;
            padding-top: 8px;
            
        }


    </style>
</head>
<body>
    <main>
        <section>
            <h1>Brasil</h1>
            <p>ordem e progresso</p>
        </section>




    </main>
</body>
</html>
